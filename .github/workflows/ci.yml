name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  bun-smoke:
    name: Bun smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: CLI list command
        run: bun src/cli.ts list

      - name: Convert degiro-transactions (fixture)
        run: |
          bun src/cli.ts convert degiro-transactions \
            test/sources/degiro-transactions/examples/Transactions.csv \
            --locale en | head -5

      - name: Convert coinbase-transactions (fixture)
        run: |
          bun src/cli.ts convert coinbase-transactions \
            test/sources/coinbase-transactions/examples/2023-transactions.csv \
            --locale en | head -5

      - name: Legacy shim (backward-compat)
        run: |
          bun src/cli.ts degiro transactions \
            test/sources/degiro-transactions/examples/Transactions.csv \
            --locale en 2>&1 | grep -q "DEPRECATED" && echo "Shim works"
